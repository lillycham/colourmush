<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>colourmush demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="mush" aria-hidden="true"></div>

    <main class="stage" id="drop">
      <figure class="art">
        <canvas id="art" width="512" height="512" aria-label="Current artwork"></canvas>
      </figure>

      <ul class="swatches" id="swatches" aria-label="Extracted palette"></ul>

      <div class="samples" id="samples" role="group" aria-label="Sample artwork"></div>

      <div class="panel">
        <label class="upload">
          Choose an image
          <input type="file" id="file" accept="image/*" hidden />
        </label>
        <span class="hint">or drop one anywhere, or paste an image</span>

        <label>Speed <input type="range" id="speed" min="0" max="3" step="0.05" value="1" /></label>
        <label>Warp <input type="range" id="intensity" min="0" max="2" step="0.05" value="1" /></label>
        <label>Grain <input type="range" id="grain" min="0" max="0.15" step="0.005" value="0.04" /></label>
        <button type="button" id="pause">Pause</button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
